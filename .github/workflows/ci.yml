name: BrewOps CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and test Backend
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test

  frontend-unit-tests:
    name: Frontend Unit Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-next/package-lock.json'
          
      - name: Install Dependencies
        run: |
          cd frontend-next
          npm ci
          
      - name: Run Unit Tests
        run: |
          cd frontend-next
          npm run test

  e2e-tests:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-next/package-lock.json'

      - name: Build Backend Jar
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Start Infrastructure (Docker Compose)
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml up -d
          echo "Waiting for Spring Boot to start..."
          sleep 20
          
      - name: Install Frontend Dependencies & Browsers
        run: |
          cd frontend-next
          npm ci
          npx playwright install --with-deps chromium
          
      - name: Run Playwright Tests
        run: |
          cd frontend-next
          npx playwright test
          
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-next/playwright-report/
          retention-days: 7
