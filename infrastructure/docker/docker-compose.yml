version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: brewops-postgres
    restart: always
    environment:
      POSTGRES_DB: brewops
      POSTGRES_USER: brewops_user
      POSTGRES_PASSWORD: brewops_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: brewops-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: