$kind: http-request
url: "{{baseUrl}}/api/v1/purchase-orders/{{poId}}/order"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Status is ORDERED', () => pm.expect(body.status).to.eql('ORDERED'));
    language: text/javascript
order: 3000
