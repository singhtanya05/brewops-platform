$kind: http-request
url: "{{baseUrl}}/api/v1/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sessionId": "{{sessionId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.environment.set('orderId', body.orderId);
    language: text/javascript
order: 3000
