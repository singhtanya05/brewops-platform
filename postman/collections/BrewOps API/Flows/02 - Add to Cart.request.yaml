$kind: http-request
url: "{{baseUrl}}/api/v1/cart/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sessionId": "{{sessionId}}",
      "variantId": "{{variantId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
