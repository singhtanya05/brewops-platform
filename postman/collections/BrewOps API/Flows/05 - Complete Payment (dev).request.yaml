$kind: http-request
url: "{{baseUrl}}/api/v1/payments/{{paymentId}}/complete"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Payment SUCCESS', () => pm.expect(pm.response.json().status).to.eql('SUCCESS'));
    language: text/javascript
order: 5000
