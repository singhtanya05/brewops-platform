$kind: http-request
url: "{{baseUrl}}/api/v1/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sessionId": "{{sessionId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        pm.environment.set('orderId', pm.response.json().orderId);
      }
    language: text/javascript
order: 1000
