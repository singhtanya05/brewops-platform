spring:
  application:
    name: brewops-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/brewops
    username: brewops_user
    password: brewops_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

brewops:
  jwt:
    secret: ${JWT_SECRET:brewops-dev-secret-key-min-32-chars-long}
    expiration-ms: 86400000
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  payment:
    timeout-minutes: 30
    timeout-check-interval-ms: 60000